# Cada push a main compila el sitio y el backend y publica el resultado en la rama
# "produccion". Hostinger (hPanel > Avanzado > Git) clona esa rama en public_html
# y, con la implementación automática activada, se actualiza sola.
name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-produccion
  cancel-in-progress: true

jobs:
  produccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar sitio (Angular)
        working-directory: frontend
        run: |
          npm ci
          npx ng build --configuration production

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Preparar la rama produccion
        run: |
          if git fetch --depth=1 origin produccion:produccion; then
            git worktree add build produccion
          else
            git worktree add --orphan -b produccion build
          fi

      - name: Armar public_html
        run: bash deploy/armar-produccion.sh "$GITHUB_WORKSPACE/build"

      - name: Publicar
        working-directory: build
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios para publicar."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push origin produccion
